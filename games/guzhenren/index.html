<style>
/* Layout: 上为「战场」(方源居左、敌人居右，敌人头顶悬着意图)，下为「手牌托盘」(真元珠、抽牌堆、手牌、弃牌堆、结束回合)。
   地图是一卷自下而上的青茅山路线图。单一夜色主题：墨绿底、青铜真元、赤铁与白银随转数变化，和文字版同一套视觉。 */
:root{
  --ink:#0e1513; --ink2:#141e1b; --ink3:#1b2824; --line:#2a3a34; --line2:#3a4d45;
  --paper:#e4dcc6; --paper2:#cfc6ae; --dim:#93a096; --faint:#66746c;
  --bronze:#b8935a; --verdigris:#5fa38c; --rust:#c45a40; --silver:#cfd7d8; --gold:#d6b456; --violet:#9a7aa8;
  --c-atk:#c45a40; --c-skl:#5fa38c; --c-pow:#d6b456; --c-sts:#7d7f86;
  --cardbg:#1d2622; --cardbg2:#26302b;
  --scrim:rgba(6,10,9,.88);
  --font-display:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --font-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cw:132px; --ch:214px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root[lang="ja"]{--font-display:"Yuji Syuku","Noto Serif JP","Noto Serif SC",serif;--font-body:"Noto Serif JP","Noto Serif SC","Hiragino Mincho ProN",serif}
:root[lang="en"]{--font-display:"Cormorant Garamond","Noto Serif SC",Georgia,serif}
:root[lang="en"] .card .cn{font-size:15.5px;line-height:1.1}
:root[lang="en"] .card .cd,:root[lang="ja"] .card .cd{font-size:10.5px;line-height:1.35}
:root[lang="en"] .brand b{font-size:22px}
.vert.h{writing-mode:horizontal-tb;font-size:clamp(40px,6.5vw,68px);line-height:1.05}
.vert.h small{display:block;margin-top:.3em;letter-spacing:.2em}
.langs{display:inline-flex;gap:2px}
.tbtn.lang{padding:3px 7px;font-size:12px}
.tbtn.lang.on{color:var(--gold);border-color:var(--bronze)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;
  background-image:radial-gradient(ellipse 80% 50% at 70% -10%,rgba(95,163,140,.10),transparent 60%),radial-gradient(ellipse 60% 40% at 0% 110%,rgba(184,147,90,.07),transparent 60%);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
em{font-style:normal;color:var(--gold)}
#app{max-width:1280px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:10px;gap:10px}
#screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ===== top bar ===== */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}
.seal{font-family:var(--font-display);background:var(--rust);color:var(--ink);width:30px;height:30px;display:grid;place-items:center;font-size:21px;border-radius:3px;transform:rotate(-4deg)}
.brand b{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.06em}
.pill{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--dim)}
.pill b{color:var(--paper);font-size:17px}
.pill.hp b{color:#e7a08f}
.pill.gold b{color:var(--gold)}
.pots{display:flex;gap:4px}
.pot{width:30px;height:30px;border:1px dashed var(--line2);border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:16px;background:transparent;color:var(--verdigris)}
.pot.has{border-style:solid;border-color:var(--verdigris);background:rgba(95,163,140,.08)}
.pot.has:hover{background:rgba(95,163,140,.22)}
.relics{display:flex;gap:4px;flex-wrap:wrap}
.relic{min-width:30px;height:30px;padding:0 6px;border:1px solid var(--bronze);border-radius:3px;display:grid;place-items:center;font-family:var(--font-display);font-size:16px;color:var(--bronze);background:rgba(184,147,90,.06);position:relative}
.relic.r-boss{border-color:var(--gold);color:var(--gold)}
.relic.spent{opacity:.35}
.relic .cnt{position:absolute;right:-4px;bottom:-6px;font-size:10px;font-family:var(--font-num);color:var(--paper)}
.barr{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbtn{background:transparent;border:1px solid var(--line2);padding:3px 11px;border-radius:3px;color:var(--dim);font-size:13px}
.tbtn:hover{color:var(--paper);border-color:var(--bronze)}
.where{font-size:13px;color:var(--dim)}
.where b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--bronze)}

/* tooltip */
#tip{position:fixed;z-index:50;max-width:260px;background:#0b110f;border:1px solid var(--line2);border-radius:3px;padding:7px 10px;font-size:12.5px;line-height:1.5;pointer-events:none;color:var(--paper)}
#tip b{color:var(--gold);font-weight:600}

/* ===== cards ===== */
.card{width:var(--cw);height:var(--ch);flex:0 0 auto;position:relative;border-radius:7px;background:linear-gradient(170deg,var(--cardbg2),var(--cardbg) 60%);border:1.5px solid var(--line2);padding:8px 8px 8px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease,opacity .14s;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--tc)}
.card.atk{--tc:var(--c-atk)} .card.skl{--tc:var(--c-skl)} .card.pow{--tc:var(--c-pow)} .card.sts,.card.cur{--tc:var(--c-sts)}
.card.r-unc{border-color:#4f8a77} .card.r-rare{border-color:var(--gold)}
.card.cur{background:linear-gradient(170deg,#262229,#1c191e)}
.card .cost{position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:50%;background:var(--ink);border:1.5px solid var(--e,var(--verdigris));display:grid;place-items:center;font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--paper)}
.card .cost.free{color:var(--verdigris)}
.card .wm{display:none;position:absolute;right:-6px;bottom:-14px;font-family:var(--font-display);font-size:92px;line-height:1;color:var(--tc);opacity:.09;pointer-events:none}
.card .cn{font-family:var(--font-display);font-size:19px;line-height:1.15;padding-left:28px;min-height:24px;color:var(--paper)}
.card.up .cn{color:var(--verdigris)}
.card .ct{font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cd{font-size:11.5px;line-height:1.42;color:var(--paper2);margin-top:3px;position:relative}
.card .art{display:block;margin:5px -2px 0;border-radius:3px;overflow:hidden;aspect-ratio:3/2;flex:0 0 auto;background:#e9e1cc;box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 12px rgba(60,40,10,.25)}
.card .art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.cur .art img,.card.sts .art img{filter:grayscale(.35) contrast(.95)}
.pimg{display:block;width:100%;max-width:180px;aspect-ratio:1/1;object-fit:contain;margin:0 auto -6px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.65));pointer-events:none}
.foe .pimg{max-width:160px}
.foe.boss{width:240px}.foe.boss .pimg{max-width:230px}
.panel.withart{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.plate{margin:0;border-radius:4px;overflow:hidden;border:1px solid var(--line2)}
.plate img{display:block;width:100%;height:auto}
.plate.paper{background:#e9e1cc;box-shadow:inset 0 0 18px rgba(60,40,10,.3)}
.plate.dark{background:radial-gradient(circle at 50% 40%,#1f2d28,var(--ink))}
.ts{position:relative;z-index:1}
.tcicada{position:absolute;right:3%;top:4%;width:min(24vw,210px);opacity:.5;pointer-events:none;filter:drop-shadow(0 0 24px rgba(214,180,86,.35))}
.card .cd b{color:var(--paper);font-family:var(--font-num);font-weight:700}
.card .cd b.hi{color:#7fd1b2} .card .cd b.lo{color:#e08a75}
.card .tags{margin-top:auto;font-size:10px;color:var(--faint);letter-spacing:.1em;position:relative}
button.card:hover{transform:translateY(-6px)}
.card.sel{transform:translateY(-22px)!important;box-shadow:0 0 0 2px var(--gold),0 10px 22px rgba(0,0,0,.5)}
.card.no{opacity:.55}
.card.mini{--cw:112px;--ch:160px}

/* ===== map ===== */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
.mapscroll{border:1px solid var(--line);border-radius:4px;background-color:var(--ink2);background-size:cover;background-position:center;max-height:calc(100vh - 120px);overflow:auto}
.mapscroll svg{display:block;width:100%;height:auto;max-width:720px;margin:0 auto}
.node{cursor:default}
.node circle.b{fill:var(--ink2);stroke:var(--line2);stroke-width:1.5}
.node text{font-family:var(--font-display);font-size:19px;fill:var(--dim);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.t-elite text{fill:var(--rust)} .node.t-boss text{fill:var(--gold);font-size:30px}
.node.t-rest text{fill:var(--verdigris)} .node.t-shop text{fill:var(--gold)} .node.t-treasure text{fill:var(--bronze)} .node.t-event text{fill:var(--violet)}
.node.done circle.b{fill:#26332d;stroke:var(--bronze)}
.node.done text{fill:var(--paper)}
.node.cur circle.b{stroke:var(--gold);stroke-width:3}
.node.avail{cursor:pointer}
.node.avail circle.b{stroke:var(--paper);stroke-width:2}
.node.avail circle.ring{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:.8;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
.node.avail:hover circle.b{fill:#2c3b35}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.edge{stroke:var(--line2);stroke-width:1.6;stroke-dasharray:3 5}
.edge.walked{stroke:var(--bronze);stroke-dasharray:none;stroke-width:2.2}
.legend{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--ink2);font-size:13.5px}
.legend h3{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--bronze);margin:0 0 4px}
.legend p{margin:0 0 10px;color:var(--dim);font-size:13px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.legend li{display:flex;gap:10px;align-items:center}
.legend .g{font-family:var(--font-display);width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:16px}

/* ===== battle ===== */
.battle{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.bf{background-size:cover!important;background-position:center 35%!important;display:grid;grid-template-columns:minmax(160px,230px) minmax(0,1fr);gap:16px;align-items:end;min-height:clamp(240px,42vh,430px);padding:12px 6px 6px;border:1px solid var(--line);border-radius:4px;background:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(95,163,140,.08),transparent 70%),var(--ink2);position:relative}
.ent{display:flex;flex-direction:column;gap:6px;align-items:stretch;position:relative}
.ent .portrait{font-family:var(--font-display);font-size:58px;line-height:1.1;text-align:center}
.me .portrait{color:var(--paper)}
.ent .nm{font-family:var(--font-display);font-size:22px;text-align:center;line-height:1.1}
.ent .sub{font-size:11.5px;color:var(--faint);text-align:center}
.hpbar{height:16px;background:var(--ink);border:1px solid var(--line2);border-radius:2px;position:relative;overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--rust);transition:width .25s}
.me .hpbar i{background:#b5524a}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-size:11px;line-height:1;color:var(--paper);text-shadow:0 1px 2px #000}
.blk{position:absolute;left:-10px;top:50%;transform:translateY(-50%);min-width:26px;height:26px;border-radius:5px 5px 13px 13px;background:#2f5f73;border:1.5px solid #8cc3d6;display:grid;place-items:center;font-family:var(--font-num);font-size:11.5px;font-weight:700;z-index:1}
.hpwrap{position:relative}
.sts{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:20px}
.chip{font-size:11.5px;border:1px solid var(--line2);border-radius:3px;padding:0 5px;line-height:18px;color:var(--verdigris);background:var(--ink)}
.chip.bad{color:#e08a75;border-color:#5b3a31}
.foes{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;align-items:flex-end}
.foe{width:170px;cursor:default;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px;text-align:inherit}
.foe.tgt{cursor:pointer;border-color:var(--gold);background:rgba(214,180,86,.06)}
.foe.tgt:hover{background:rgba(214,180,86,.14)}
.foe .portrait{color:var(--rust);font-size:54px}
.foe.boss .portrait{color:var(--gold);font-size:72px}
.intent{display:flex;align-items:center;justify-content:center;gap:6px;min-height:30px;font-size:13px;color:var(--dim)}
.intent .ic{font-family:var(--font-display);font-size:17px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.intent.atk{color:#e08a75} .intent.def{color:#8cc3d6} .intent.buf{color:var(--gold)} .intent.deb{color:var(--violet)} .intent.chg{color:#f1c27d}
.intent b{font-family:var(--font-num);font-size:16px;color:var(--paper)}
.intent .mvn{font-size:12px;color:var(--faint)}
.hit{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fxn{position:fixed;z-index:40;font-family:var(--font-num);font-weight:700;font-size:22px;pointer-events:none;animation:rise .9s ease-out forwards;text-shadow:0 2px 4px #000}
.fxn.dmg{color:#ff9c84} .fxn.blk{color:#9fd3e6} .fxn.heal{color:#7fd1b2} .fxn.txt{color:var(--gold);font-family:var(--font-display);font-weight:400;font-size:24px}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
.tray{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:end}
.tl,.tr{display:flex;flex-direction:column;gap:8px;align-items:center}
.orb{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle,var(--e1c,#3f7f6c),#16302a 75%);border:2px solid var(--e1,#5fa38c);box-shadow:0 0 18px rgba(95,163,140,.35)}
.orb b{font-family:var(--font-num);font-size:24px;line-height:1}
.orb small{display:block;font-size:10.5px;color:var(--paper2);letter-spacing:.1em}
.pile{background:var(--ink2);border:1px solid var(--line2);border-radius:4px;padding:3px 10px;font-size:12.5px;color:var(--dim)}
.pile:hover{border-color:var(--bronze);color:var(--paper)}
.pile b{color:var(--paper);font-family:var(--font-num)}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--ch) + 26px);padding-top:24px;overflow-x:auto;overflow-y:visible}
.hand{gap:6px}
.hand.crowd{gap:0}.hand.crowd .card{margin:0 -16px}
.hand.crowd .card:first-child{margin-left:0}.hand.crowd .card:last-child{margin-right:0}
.tbtn.snd{min-width:30px;padding:3px 8px;font-family:var(--font-display);font-size:15px;color:var(--verdigris);border-color:#3f6b5d}
.tbtn.snd.off{color:var(--faint);border-color:var(--line2);text-decoration:line-through}
.autob{background:transparent;border:1px solid var(--line2);border-radius:4px;padding:6px 10px;color:var(--dim);font-size:13px;white-space:nowrap}
.autob:hover{border-color:var(--bronze);color:var(--paper)}
.autob.on{border-color:var(--verdigris);color:var(--verdigris);background:rgba(95,163,140,.12)}
.endt{background:var(--bronze);color:var(--ink);border:none;border-radius:4px;padding:12px 16px;font-family:var(--font-display);font-size:20px;line-height:1.1}
.endt:hover{background:var(--gold)}
.endt:disabled{opacity:.4;cursor:wait}
.hint{text-align:center;font-size:12.5px;color:var(--faint);min-height:18px}

/* ===== generic panels ===== */
.panel{border:1px solid var(--line);border-radius:4px;background:var(--ink2);padding:18px;max-width:900px;margin:0 auto;width:100%}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--bronze);margin:0 0 4px;line-height:1.2}
.panel .lead{color:var(--dim);margin:0 0 14px;max-width:48em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--bronze);background:#22312b}
.opt b{font-weight:600}
.opt span{font-size:12.5px;color:var(--dim)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt.key{border-color:var(--bronze)}
.cardrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:18px 0 8px}
.cardrow .card{--cw:160px;--ch:248px}
.cardrow .card .cn{font-size:22px}
.cardrow .card .cd{font-size:13px}
.rw{display:flex;flex-direction:column;gap:8px;max-width:440px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:8px 18px}
.btn:hover{border-color:var(--bronze)}
.btn.key{background:var(--bronze);color:var(--ink);border-color:var(--bronze);font-weight:600}
.btn.key:hover{background:var(--gold)}
.shopgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.ware{display:flex;flex-direction:column;align-items:center;gap:6px}
.ware .price{font-family:var(--font-num);color:var(--gold);font-size:14px}
.ware .price.no{color:var(--rust)}
.ware.sold{opacity:.3;pointer-events:none}
.wbox{width:150px;border:1px solid var(--line2);border-radius:4px;padding:10px;text-align:left;background:var(--ink3);min-height:100px}
.wbox b{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--bronze);display:block}
.wbox span{font-size:12px;color:var(--dim)}
.sec{font-size:12px;letter-spacing:.24em;color:var(--faint);margin:18px 0 8px;border-bottom:1px dashed var(--line);padding-bottom:4px}

/* modal */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:30;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 30px}
.ov .panel{margin-top:3vh;max-width:1040px}
.closex{float:right;background:transparent;border:1px solid var(--line2);border-radius:3px;padding:2px 12px;color:var(--dim)}
.deckgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start}
.deckgrid .card{--cw:140px;--ch:224px}
.deckgrid button.card:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--bronze)}

/* title / end */
.title-screen{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center;max-width:1000px;margin:3vh auto 0;padding:clamp(20px,4vw,48px);border:1px solid var(--line);border-radius:6px;background-size:cover;background-position:center;overflow:hidden}
.vert{writing-mode:vertical-rl;font-family:var(--font-display);font-size:clamp(64px,12vw,118px);line-height:1;letter-spacing:.08em;text-shadow:0 0 30px rgba(95,163,140,.25)}
.vert small{font-size:.3em;color:var(--bronze);letter-spacing:.4em;margin-top:.6em}
.ts .big{font-family:var(--font-display);font-size:26px;line-height:1.4;margin:0 0 10px}
.ts p{color:var(--dim);max-width:34em}
.ts .fan{font-size:12px;color:var(--faint);margin-top:20px;line-height:1.7}
.ts .fan a{color:var(--bronze)}
.unl{display:grid;gap:6px;margin-top:14px}
.unl div{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--faint)}
.unl div.on{color:var(--paper2)}
.unl div b{font-family:var(--font-num);min-width:4em;color:var(--faint)}
.unl div.on b{color:var(--gold)}
.meter{height:8px;background:var(--ink);border:1px solid var(--line2);border-radius:2px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:3px;padding:6px 10px}
.stat small{display:block;font-size:11px;color:var(--faint);letter-spacing:.1em}
.stat b{font-size:18px}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;font-family:var(--font-display);font-size:clamp(34px,7vw,64px);color:var(--gold);text-shadow:0 0 24px rgba(0,0,0,.9);pointer-events:none;animation:ban 1.3s ease forwards;white-space:nowrap}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-40%)}20%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0}}

@media (max-width:860px){
  :root{--cw:108px;--ch:184px}
  .card .cn{font-size:16px} .card .cd{font-size:11px} .card .wm{font-size:70px}
  .bf{grid-template-columns:1fr;align-items:start}
  .me{flex-direction:row;align-items:center;gap:10px}
  .me .portrait{font-size:30px}
  .me .pimg{width:84px;margin:0}
  .foe .pimg{max-width:120px}.foe.boss{width:180px}.foe.boss .pimg{max-width:170px}
  .panel.withart{grid-template-columns:1fr}.panel.withart .plate{order:-1;max-width:320px}
  .tcicada{width:110px;top:auto;bottom:10px;opacity:.5}
  .me>.col{flex:1}
  .foes{justify-content:center}
  .foe{width:150px}
  .tray{grid-template-columns:1fr 1fr;grid-template-areas:"l r" "h h"}
  .tl{grid-area:l;flex-direction:row}.tr{grid-area:r;flex-direction:row;justify-content:flex-end}.hand{grid-area:h;flex-wrap:wrap;gap:8px;justify-content:center;overflow:visible;padding-top:16px}
  .hand .card{margin:0!important}
  .bf{min-height:0}
  .orb{width:56px;height:56px}
  .mapwrap{grid-template-columns:1fr}
  .title-screen{grid-template-columns:1fr;gap:10px;margin-top:2vh}
  .vert{writing-mode:horizontal-tb;font-size:60px}
  .vert small{display:block;margin-top:.2em}
  .cardrow .card{--cw:132px;--ch:214px}
}
@media (max-width:520px){.foe{width:128px}.foe .portrait{font-size:30px}.ent .nm{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= 敌人 =================
   招式字段：dmg 伤害 hits 段数 blk 自身格挡 blkAlly 给同伴格挡 buf 自身增益 bufAll 全体增益 deb 对你的减益
            add 塞入你弃牌堆的状态牌 heal 自愈 healAlly 治疗同伴 sum 召唤 chg 蓄力 */
function rnd(e,w,max={}){
  const last=e.hist[e.hist.length-1];let streak=0;for(let i=e.hist.length-1;i>=0&&e.hist[i]===last;i--)streak++;
  const ok=Object.entries(w).filter(([k])=>!(k===last&&streak>=(max[k]||9)));
  const s=ok.reduce((a,x)=>a+x[1],0);let r=Math.random()*s;for(const [k,v] of ok){r-=v;if(r<0)return k}return ok[0][0];
}

const ROWS=13,COLS=7;
function genMap(){
  const nodes={},edges=[];
  const key=(r,c)=>r+','+c;
  const starts=[];
  for(let p=0;p<6;p++){
    let c=p<2?(p===0?RI(0,2):RI(4,6)):RI(0,COLS-1);
    starts.push(c);
    for(let r=0;r<ROWS;r++){
      nodes[key(r,c)]=nodes[key(r,c)]||{r,c};
      if(r===ROWS-1)break;
      let cand=[c-1,c,c+1].filter(x=>x>=0&&x<COLS);
      cand=cand.filter(nc=>!edges.some(([r1,a,r2,b])=>r1===r&&((a-c)*(b-nc)<0)));
      const nc=cand.length?pick(cand):c;
      if(!edges.some(e=>e[0]===r&&e[1]===c&&e[3]===nc))edges.push([r,c,r+1,nc]);
      c=nc;
    }
  }
  const parents=(n)=>edges.filter(e=>e[2]===n.r&&e[3]===n.c).map(e=>nodes[key(e[0],e[1])]);
  const rows=[...Array(ROWS)].map((_,r)=>Object.values(nodes).filter(n=>n.r===r));
  for(let r=0;r<ROWS;r++)for(const n of rows[r]){
    if(r===0){n.type='fight';continue}
    if(r===6){n.type='treasure';continue}
    if(r===ROWS-1){n.type='rest';continue}
    let t;for(let k=0;k<8;k++){
      const x=Math.random()*100;
      t=x<45?'fight':x<67?'event':x<83?'elite':x<95?'rest':'shop';
      if(r<4&&(t==='elite'||t==='rest'))continue;
      if(r===ROWS-2&&t==='rest')continue;
      if((t==='elite'||t==='rest'||t==='shop')&&parents(n).some(p=>p.type===t))continue;
      break;
    }
    n.type=t;
  }
  Object.values(nodes).forEach(n=>{n.jx=RI(-12,12);n.jy=RI(-10,10)});
  R.map={nodes,edges,done:[]};
  R.pos=null;
}
function availNodes(){
  const m=R.map;
  if(!R.pos)return Object.values(m.nodes).filter(n=>n.r===0);
  if(R.pos.r===ROWS-1)return [{r:ROWS,c:3,type:'boss'}];
  return m.edges.filter(e=>e[0]===R.pos.r&&e[1]===R.pos.c).map(e=>m.nodes[e[2]+','+e[3]]);
}
function nodeXY(n){const W=700;if(n.r===ROWS)return {x:W/2,y:58};const H=(ROWS+1)*74+80;return {x:70+n.c*93+(n.jx||0),y:H-50-n.r*74+(n.jy||0)}}

  for(const [r1,a,r2,b] of m.edges){const p=nodeXY(m.nodes[r1+','+a]),q=nodeXY(m.nodes[r2+','+b]);const w=done(r1+','+a)&&done(r2+','+b);svg+=`<line class="edge ${w?'walked':''}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`}
  const boss={r:ROWS,c:3,type:'boss'};const bp=nodeXY(boss);
  Object.values(m.nodes).filter(n=>n.r===ROWS-1).forEach(n=>{const p=nodeXY(n);svg+=`<line class="edge ${done(n.r+','+n.c)&&R.pos&&R.pos.r===ROWS-1&&R.pos.c===n.c?'walked':''}" x1="${p.x}" y1="${p.y}" x2="${bp.x}" y2="${bp.y+30}"/>`});

    <ul>${Object.entries(NODE_G).map(([k,g])=>`<li><span class="g" style="color:var(--${{fight:'dim',elite:'rust',event:'violet',rest:'verdigris',shop:'gold',treasure:'bronze',boss:'gold'}[k]})">${g}</span>${NODE_N[k]}</li>`).join('')}</ul>
    <p style="margin-top:12px">${L('点亮的节点可以前往。路只能往上走。')}</p></aside></div>`;
  $('#screen').querySelectorAll('[data-n]').forEach(el=>{const go=()=>enterNode(el.dataset.n);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  const ms=$('#ms');const y=R.pos?nodeXY(R.pos.r===ROWS?{r:ROWS,c:3}:R.map.nodes[R.pos.r+','+R.pos.c]).y:H;
  requestAnimationFrame(()=>{ms.scrollTop=Math.max(0,(y/H)*ms.scrollHeight-ms.clientHeight*.65)});
}

function startBattle(group,kind){

function maxE(){return 3+R.relics.filter(k=>RELICS[k].boss).length}
function addP(k,n){B.p.st[k]=(B.p.st[k]||0)+n}
function addE(e,k,n){if(!e||e.hp<=0)return;e.st[k]=(e.st[k]||0)+n}
function gainE(n){B.e+=n}
function gainBlock(n){let b=n;if(B.p.st.frail>0)b=Math.floor(b*.75);B.p.block+=b;if(b>0)fxAt($('#me'),'+'+b,'blk')}
function heal(n,quiet){const v=Math.min(n,R.maxHp-R.hp);R.hp+=v;if(B&&!quiet){fxAt($('#me'),'+'+v,'heal');if(v>0)SND.fx('heal')}}
function calcP(base,card,t,smul=1,raw){
  let d=base;
  if(!raw){d+=(B.p.st.str||0)*smul;if(card&&(card.tags||[]).includes('月'))d+=B.p.st.moon||0}
  if(B.p.st.weak>0)d*=.75;
  if(t&&t.st.vuln>0)d*=1.5;
  return Math.max(0,Math.floor(d));
}
function pAtk(t,base,hits,card,smul=1,raw){
  for(let h=0;h<hits;h++){
    if(!t||t.hp<=0){break}
    damageEnemy(t,calcP(base,card,t,smul,raw));
  }
}
function pAtkAll(base,hits,card){for(let h=0;h<hits;h++)alive().forEach(e=>damageEnemy(e,calcP(base,card,e)))}
function damageEnemy(e,d,pierce){
  if(e.hp<=0)return;
  let left=d;
  if(!pierce&&e.block>0){const a=Math.min(e.block,left);e.block-=a;left-=a}
  e.hp-=left;
  SND.fx(left<=0?'block':left>=15?'heavy':'hit');
  const el=document.querySelector(`[data-e="${e.id}"]`);
  fxAt(el,left>0?'-'+left:L('格挡'),'dmg');if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
  if(e.def.hurt&&e.hp>0)e.def.hurt(e);
  if(e.hp<=0){e.hp=0;R.stats.kills++;SND.fx('kill');if(e.def.boss)B.en.filter(x=>x!==e).forEach(x=>x.hp=0)}

function playerHit(e,base){

function calcE(e,base){let d=base+(e.st.str||0);if(e.st.weak>0)d*=.75;if(B.p.st.vuln>0)d*=1.5;return Math.max(0,Math.floor(d))}
function draw(n){

function startTurn(){

  if(B.p.st.gangzong)addP('str',B.p.st.gangzong);

function cardCost(c){if(B&&B.free)return 0;return cost(c.key,c.up)}
function playable(c){
  const d=CARDS[c.key];

}
function needsTarget(c){return !!CARDS[c.key].tgt}
function clickCard(i){

  playCard(c,alive()[0]);
}
function clickEnemy(id){

function playCard(c,t){
  const d=CARDS[c.key];
  SEL=null;

  B.hand.splice(B.hand.indexOf(c),1);

  if(d.t==='atk'&&has('jiunang')){R.jiunang=(R.jiunang||0)+1;if(R.jiunang>=10){R.jiunang=0;gainE(1);fxAt($('#orb'),'+1','heal')}}
  if(d.t==='pow'){}else if(V(d.ex,c.up))B.exh.push(c);else B.disc.push(c);

  if(!B.over)renderBattle();

function usePotion(i){
  const k=R.pots[i];if(!k)return;const p=POTS[k];
  if(!B||SCREEN!=='battle'){if(p.any){p.use();R.pots[i]=null;saveRun();renderBar();if(SCREEN==='map')mapScreen()}return}
  if(B.busy||B.over)return;

function checkWin(){

async function endTurn(){
  if(!B||B.busy||B.over)return;

  if(has('tongpi')&&B.p.block===0)gainBlock(6);

  renderBattle();
  await wait(250);
  for(const e of [...B.en]){
    if(e.hp<=0)continue;
    e.block=0;
    if(e.st.bleed>0){const b=e.st.bleed;e.st.bleed--;damageEnemy(e,b,true);renderBattle();await wait(200);checkWin();if(B.over)return;if(e.hp<=0)continue}
    await enemyAct(e);
    if(B.over)return;
    ['weak','vuln'].forEach(k=>{if(e.st[k]>0)e.st[k]--});
    e.turnN++;
    renderBattle();
    await wait(300);
  }
  checkWin();if(B.over)return;
  alive().forEach(e=>{if(!e.fresh)chooseIntent(e);e.fresh=0});
  startTurn();
}
async function enemyAct(e){
  const m=e.move;e.hist.push(e.mk);
  const el=document.querySelector(`[data-e="${e.id}"]`);if(el)el.style.transform='translateX(-14px)';
  await wait(160);if(el)el.style.transform='';
  if(m.blk){e.block+=m.blk}
  if(m.blkAlly){const al=pick(alive().filter(a=>a!==e).concat(m.blk?[]:[e]));if(al)al.block+=m.blkAlly}
  if(m.buf)for(const k in m.buf)addE(e,k,m.buf[k]);
  if(m.bufAll)alive().forEach(a=>{for(const k in m.bufAll)addE(a,k,m.bufAll[k])});
  if(m.heal)e.hp=Math.min(e.max,e.hp+m.heal);
  if(m.healAlly){const al=alive().filter(a=>a!==e).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]||e;al.hp=Math.min(al.max,al.hp+m.healAlly)}
  if(m.sum){for(const k of m.sum){if(alive().length>=5)break;const s=mkEnemy(k);s.minion=1;chooseIntent(s);s.fresh=1;B.en.push(s)}renderBattle()}
  if(m.dmg){for(let h=0;h<(m.hits||1);h++){playerHit(e,m.dmg);if(B.over)return;renderBattle();await wait(130)}}
  if(m.deb)for(const k in m.deb)addP(k,m.deb[k]);
  if(m.add)for(const k in m.add)for(let i=0;i<m.add[k];i++)B.disc.push(mkCard(k));
}

let AUTO=false; try{AUTO=localStorage.getItem('gzr.cards.auto')==='1'}catch(e){}
let autoRunning=false;
const AUTO_HITS={shuangren:2,jinwu:4,fengbao:3};
const AUTO_ALL=new Set(['yuexuan','fengbao']);
const incE=e=>e&&e.move&&e.move.dmg?calcE(e,e.move.dmg)*(e.move.hits||1):0;
const autoOn=()=>!!(B&&B.auto);
/* 普通战斗沿用全局开关；首领战默认手动，在首领战里打开只对这一场生效 */
function setAuto(v){
  if(!B||B.kind!=='boss'){AUTO=v;try{localStorage.setItem('gzr.cards.auto',v?'1':'0')}catch(e){}}
  if(B){B.auto=v}
  if(B&&SCREEN==='battle'){renderBattle();if(v)autoRun()}
}
/* 给手牌逐张打分，返回最值得打的一张；没有值得打的就返回 null（结束回合） */
function autoPick(){
  const foes=alive();if(!foes.length)return null;
  const need=B.p.st.buffer>0?0:Math.max(0,foes.reduce((a,e)=>a+incE(e),0)-B.p.block);
  const bristle=foes.some(e=>e.st.bristle);
  const hpPct=R.hp/R.maxHp;
  const atkInHand=B.hand.some(c=>CARDS[c.key].t==='atk'&&!playable(c));
  let best=null;
  for(const c of B.hand){
    if(playable(c))continue;
    const d=CARDS[c.key],u=c.up,k=c.key,div=Math.max(cardCost(c),.6);
    let v=0,t=null;
    if(d.t==='pow'){
      v=B.turn<=2?60:(need>12?8:30);
      if(k==='moxin'&&!B.hand.some(x=>x.key==='fangxue'||x.key==='xueji'))v=12;
    }else if(d.t==='atk'){
      const hits=AUTO_HITS[k]||1;
      if(AUTO_ALL.has(k)){
        v=foes.reduce((a,e)=>a+Math.min(e.hp+e.block,calcP(V(d.dmg,u),d,e)*hits),0)/div;
        if(foes.length===1)v*=.9;
      }else{
        const raw=k==='yuti',base=raw?B.p.block:k==='zhuquan'?12:V(d.dmg,u),smul=k==='zhuquan'?V(d.smul,u):1;
        let bv=-1;
        for(const e of foes){
          const dm=calcP(base,d,e,smul,raw)*hits,kill=dm>=e.hp+e.block;
          const sc=Math.min(dm,e.hp+e.block)+(kill?25+incE(e):0);
          if(sc>bv){bv=sc;t=e}
        }
        v=bv/div;
        if(k==='xueji'&&hpPct<.35)v=0;
        if(k==='shedu'||k==='xueyue')v+=V(d.m,u)*.8/div;
        if(k==='chongzhuang')v+=6;
      }
    }else{
      const blk=d.blk?V(d.blk,u):0;
      if(blk){
        v=Math.min(blk,need)*1.6/div;
        if(k==='qingsi'){t=foes.slice().sort((a,b)=>incE(b)-incE(a))[0];v+=incE(t)>0?6:2}
        if(k==='jinguang')v+=foes.length*3;
        if(k==='yinshi')v+=2;
      }else switch(k){
        case 'yinlin':v=need>=10?need*1.4/div:0;break;
        case 'jiuchong':v=18;break;
        case 'guanjiu':v=10+V(d.m,u)*3;break;
        case 'fangxue':v=hpPct>.5&&B.hand.some(x=>x!==c&&CARDS[x.key].c!==-1&&cardCost(x)>B.e)?14:0;break;
        case 'lengyan':t=foes.slice().sort((a,b)=>b.hp-a.hp)[0];v=atkInHand?14:6;break;
        case 'duwu':v=V(d.m,u)*foes.length*1.1/div;break;
        case 'xiongli':v=B.p.st.str>=2?B.p.st.str*6:0;break;
        case 'zhiliao':v=hpPct<.7?V(d.m,u)*1.5:0;break;
        case 'sheli':v=B.hand.length>=4?16:0;break;
        case 'chunqiu':v=B.hand.filter(x=>x!==c&&!playable(x)).reduce((a,x)=>a+cost(x.key,x.up),0)>=3?40:0;break;
        case 'xuehai':t=foes.slice().sort((a,b)=>(b.st.bleed||0)-(a.st.bleed||0))[0];v=(t.st.bleed||0)>=5?t.st.bleed*2:0;break;
        default:v=0; // 吸纳元石要花元石，自动战斗不替你花
      }
      if(bristle&&v>0&&need<15)v*=.4; // 怒鬃：少出守牌
    }
    if(v>0&&(!best||v>best.v))best={c,v,t};
  }
  return best;
}
const sleep=ms=>SPEED?new Promise(r=>setTimeout(r,ms)):Promise.resolve();
async function autoRun(){
  if(autoRunning)return;
  autoRunning=true;
  try{
    while(autoOn()&&SCREEN==='battle'&&!B.over){
      if(B.busy){await sleep(150);continue}
      await sleep(450);
      if(!autoOn()||SCREEN!=='battle'||B.over||B.busy)continue;
      const p=autoPick();
      if(p){
        const t=CARDS[p.c.key].tgt?(p.t||alive().slice().sort((a,b)=>a.hp-b.hp)[0]):alive()[0];
        SEL=null;playCard(p.c,t);
      }else await endTurn();
    }
  }finally{autoRunning=false}
}

/* ================= 音乐与音效（Web Audio 现场合成，不用音频文件） ================= */
const SND=(()=>{
  let ctx=null,master,musicBus,sfxBus,mode='none';
  let musicOn=true,sfxOn=true;
  try{musicOn=localStorage.getItem('gzr.cards.music')!=='0';sfxOn=localStorage.getItem('gzr.cards.sfx')!=='0'}catch(e){}
  const SCALE=[0,3,5,7,10];                       // 五声音阶（羽调式）
  const ks=new Map(),last={};
  function init(){
    if(ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    musicBus=ctx.createGain();musicBus.gain.value=musicOn?.3:0;
    sfxBus=ctx.createGain();sfxBus.gain.value=sfxOn?.26:0;
    // 混响：一段指数衰减的噪声
    const verb=ctx.createConvolver(),len=Math.floor(ctx.sampleRate*2.6),ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    verb.buffer=ir;
    const wetM=ctx.createGain();wetM.gain.value=.4;const wetS=ctx.createGain();wetS.gain.value=.18;
    musicBus.connect(master);musicBus.connect(wetM);wetM.connect(verb);
    sfxBus.connect(master);sfxBus.connect(wetS);wetS.connect(verb);
    verb.connect(master);
  }
  const unlock=()=>{init();if(ctx&&ctx.state==='suspended')ctx.resume();if(!unlocked){unlocked=true;switchTrack(null,mode)}};
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  /* 拨弦（Karplus-Strong），按音高缓存 */
  function pluckBuf(f,dur=2.6){
    const key=Math.round(f*10);if(ks.has(key))return ks.get(key);
    const sr=ctx.sampleRate,n=Math.floor(sr*dur),N=Math.max(2,Math.round(sr/f));
    const b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);
    for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
    for(let i=1;i<N;i++)d[i]=(d[i]+d[i-1])*.5;            // 先磨圆一点，音色更温
    for(let i=N;i<n;i++)d[i]=.4985*(d[i-N]+d[i-N+(i-N+1<i?1:0)]);
    ks.set(key,b);return b;
  }
  function pluck(f,t,vol=.5,bus=musicBus,cut=2600){
    const src=ctx.createBufferSource();src.buffer=pluckBuf(f);
    const g=ctx.createGain();g.gain.value=vol;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;
    src.connect(lp);lp.connect(g);g.connect(bus);src.start(t);src.stop(t+2.6);
  }
  function tone(type,f0,f1,t,dur,vol,bus=sfxBus){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);
  }
  function noise(t,dur,vol,type,f0,f1,bus=sfxBus,q=1){
    const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=b;
    const fl=ctx.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    src.connect(fl);fl.connect(g);g.connect(bus);src.start(t);
  }
  const drum=(t,vol=.8,low=1,bus=musicBus)=>{tone('sine',115*low,42*low,t,.45,vol,bus);noise(t,.06,vol*.35,'lowpass',900,300,bus)};
  function gong(t,base=98,vol=.35,bus=sfxBus){[1,2.76,5.4,8.93].forEach((m,i)=>tone('sine',base*m,base*m*.995,t,3.2-i*.5,vol/(i+1),bus))}
  const noteF=(root,idx)=>root*Math.pow(2,(SCALE[((idx%5)+5)%5]+12*Math.floor(idx/5))/12);
  /* 背景音乐：播放 assets/music 里的曲子，场景切换时淡入淡出 */
  const TRACKS={calm:'assets/music/calm.mp3',battle:'assets/music/battle.mp3',boss:'assets/music/boss.mp3'};
  const VOL={calm:.5,battle:.45,boss:.5};
  /* 只用一个播放器：换曲时先淡出停下，再换下一首，任何时候只有一首在放 */
  let unlocked=false,au=null,cur=null;
  function ensure(){if(!au){au=new Audio();au.loop=true;au.preload='auto';au.volume=0}return au}
  function fadeTo(a,target,ms,then){
    clearInterval(a._fade);const v0=a.volume,t0=performance.now();
    a._fade=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,v0+(target-v0)*k));if(k>=1){clearInterval(a._fade);then&&then()}},50);
  }
  function switchTrack(prev,m){
    const a=ensure();
    if(m==='none'||!musicOn||!unlocked){fadeTo(a,0,500,()=>a.pause());return}
    if(cur===m&&!a.paused){fadeTo(a,VOL[m],600);return}
    const go=()=>{a.pause();a.src=TRACKS[m];cur=m;a.play().catch(()=>{});fadeTo(a,VOL[m],1200)};
    if(!a.paused&&a.volume>.01)fadeTo(a,0,600,go);else go();
  }
  addEventListener('pagehide',()=>{if(au)au.pause()});
  function music(m){if(m===mode)return;const prev=mode;mode=m;switchTrack(prev,m)}
  /* 钟磬：柔和起音、带一个泛音、慢慢衰减；木鱼：短促的木质敲击 */
  function bell(f,t,vol,dur){[[1,1],[2.76,.25]].forEach(([m,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.012);g.gain.exponentialRampToValueAtTime(.0005,t+dur*(m>1?.4:1));o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+.05)})}
  function wood(t,vol,f=480){tone('sine',f,f*.85,t,.07,vol);noise(t,.02,vol*.5,'bandpass',f*4,f*3.5,sfxBus,4)}
  /* 音效 */
  function fx(name,arg){
    if(!ctx||!sfxOn||!SPEED)return;
    const t=ctx.currentTime;if(last[name]&&t-last[name]<.035)return;last[name]=t;
    switch(name){
      case 'card':noise(t,.1,.14,'bandpass',2000,800,sfxBus,1.2);break;
      case 'moon':noise(t,.1,.18,'bandpass',2600,1200,sfxBus,1.5);tone('sine',1320,1300,t,.4,.12);tone('sine',1980,1960,t+.01,.3,.06);break;
      case 'power':bell(880,t,.14,1.2);bell(1320,t+.12,.08,1);break;
      case 'hit':noise(t,.08,.35,'lowpass',1600,400);tone('sine',170,60,t,.16,.35);break;
      case 'heavy':noise(t,.14,.45,'lowpass',1200,200);tone('sine',120,40,t,.3,.55);break;
      case 'block':tone('sine',430,380,t,.09,.3);noise(t,.03,.25,'bandpass',2400,2000,sfxBus,3);break;
      case 'hurt':tone('sine',95,38,t,.35,.6);noise(t,.18,.3,'lowpass',500,120);break;
      case 'kill':wood(t,.3,380);tone('sine',330,170,t+.04,.5,.18);break;
      case 'heal':bell(660,t,.14,1.4);break;
      case 'gold':bell(1320,t,.08,.6);bell(1760,t+.07,.06,.6);break;
      case 'click':wood(t,.18,520);break;
      case 'turn':drum(t,.35,1.2,sfxBus);break;
      case 'win':gong(t,98,.3);bell(587,t+.25,.1,2);break;
      case 'lose':gong(t,65,.38);break;
      case 'cicada':tone('sine',300,1800,t,1.4,.1);bell(1175,t+.5,.1,2);bell(1760,t+.7,.06,1.8);break;
    }
  }
  function toggle(kind){
    if(kind==='music'){musicOn=!musicOn;switchTrack(null,musicOn?mode:'none')}
    else{sfxOn=!sfxOn;if(sfxBus)sfxBus.gain.setTargetAtTime(sfxOn?.26:0,ctx.currentTime,.05)}
    try{localStorage.setItem('gzr.cards.'+kind,(kind==='music'?musicOn:sfxOn)?'1':'0')}catch(e){}
    unlock();
  }
  return {music,fx,toggle,on:k=>k==='music'?musicOn:sfxOn};
})();

function rewardScreen(rw){
  SCREEN='reward';
  // 元石、宝物、药囊没什么可选的，进来就自动收下；只有蛊牌和首领宝物需要你挑
  const got=[];
  for(const x of rw){
    if(x.t==='gold'){const n=gainGold(x.n);x.taken=1;got.push(has('jinling')?L('元石（商家金令：无法获得）'):L('元石 +{n}',{n}))}

    else if(x.t==='pot'&&addPotion(x.k)){x.taken=1;got.push(L('药囊 · {p}',{p:POTS[x.k].n}))}
  }
  renderBar();saveRun();
  const draw=()=>{
    const left=rw.filter(x=>!x.taken&&(x.t==='card'||x.t==='boss'));
    $('#screen').innerHTML=`<div class="panel"><h2>${L('战利品')}</h2>
      ${got.length?`<p class="lead">${L('已收下：{x}。',{x:got.join(L('，'))})}</p>`:''}
      <div class="rw">${rw.map((x,i)=>{
        if(x.taken)return '';
        if(x.t==='pot')return `<div class="opt" aria-disabled="true"><b>${POTS[x.k].n}</b><span>${L('囊袋已满，没有拾取')}</span></div>`;
        if(x.t==='card')return `<button class="opt key" type="button" data-r="${i}"><b>${L('选一张蛊牌加入牌组')}</b><span>${L('三选一，也可跳过')}</span></button>`;
        if(x.t==='boss')return `<button class="opt key" type="button" data-r="${i}"><b>${L('首领宝物')}</b><span>${L('三选一')}</span></button>`;
        return '';
      }).join('')}</div><div class="btnrow"><button class="btn ${left.length?'':'key'}" id="cont" type="button">${L('继续前行')}</button></div></div>`;
    $('#screen').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>take(rw[+b.dataset.r]));
    $('#cont').onclick=finishNode;
  };

    if(x.t==='card'){chooseCard(x.cards,c=>{if(c)R.deck.push(c);x.taken=1;renderBar();saveRun();draw()});return}

  };

function endRun(win){
  SCREEN='end';
  const s=R.stats;
  const gain=s.floors*5+s.elites*15+s.bosses*60+(win?200:0);
  const before=META.guang;
  META.guang+=gain;META.runs++;if(win)META.wins++;META.best=Math.max(META.best,R.act*20+R.floor);
  saveMeta();clearRun();
  const newly=UNLOCKS.filter(u=>before<u.at&&META.guang>=u.at);
  const nxt=UNLOCKS.find(u=>META.guang<u.at);
  renderBar();
  $('#screen').innerHTML=`<div class="panel"><h2 style="font-size:46px;color:${win?'var(--gold)':'var(--rust)'}">${L(win?'天地我在独行':'身死道消')}</h2>
    <p class="lead">${win?L('义天山的烟尘散尽。正道与魔道都记住了一个名字：古月方源。这只是开始。'):L('你倒在了{a}第 {f} 层。{c}这一世到此为止。',{a:ACTS[R.act],f:R.floor,c:R.cicada?'':L('春秋蝉已经沉睡，')})}</p>

    ${newly.length?`<div class="opts">${newly.map(u=>`<div class="opt key"><b>${L('解锁 · {n}',{n:u.n})}</b><span>${u.d}</span></div>`).join('')}</div>`:''}
    ${nxt?`<p style="margin-top:12px">${L('累计光阴 {g}，距下一项解锁「{n}」还差 {d}。',{g:META.guang,n:nxt.n,d:nxt.at-META.guang})}</p><div class="meter"><i style="width:${Math.min(100,META.guang/nxt.at*100)}%"></i></div>`:`<p>${L('所有记忆均已解锁。')}</p>`}

  $('#again').onclick=newRun;$('#home').onclick=titleScreen;
}

function banner(s){if(!SPEED)return;const b=document.createElement('div');b.className='banner';b.textContent=s;document.body.appendChild(b);setTimeout(()=>b.remove(),1300)}
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el){tip.hidden=true;return}tip.innerHTML=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();const tw=tip.offsetWidth;let x=Math.min(innerWidth-tw-8,Math.max(8,r.left+r.width/2-tw/2));let y=r.bottom+8;if(y+tip.offsetHeight>innerHeight-8)y=r.top-tip.offsetHeight-8;tip.style.left=x+'px';tip.style.top=y+'px'});
document.addEventListener('scroll',()=>tip.hidden=true,true);
document.addEventListener('keydown',e=>{
  if(!$('#ov').hidden){if(e.key==='Escape'&&$('#ov .closex'))$('#ov .closex').click();return}
  if(SCREEN!=='battle'||!B)return;
  if(e.key==='Escape'){SEL=null;renderBattle()}
  else if(e.key==='e'||e.key==='E')endTurn();
  else if(e.key==='a'||e.key==='A')setAuto(!autoOn());
  else if(/^[0-9]$/.test(e.key)){const i=e.key==='0'?9:+e.key-1;clickCard(i)}
});

/* ================= 多语言 ================= */
const ZH={};
const BRAND=()=>LANG==='zh'?'蛊真人':I18N[LANG].title;
const HERO=()=>LANG==='zh'?'古月方源':I18N[LANG].hero;
const TAGN=t=>LANG==='zh'?t:(I18N[LANG].tags[t]||t);
const Q=n=>LANG==='en'?`"${n}"`:`「${n}」`;
function snapZh(){
  if(ZH.done)return;ZH.done=1;
  ZH.acts=[...ACTS];ZH.nodes={...NODE_N};ZH.tn={...TN};ZH.rn={...RN};
  const m=(o,f)=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,f(v)]));
  ZH.st=m(ST,v=>[v.n,v.d]);ZH.cards=m(CARDS,v=>[v.n,v.gu,v.desc]);ZH.relics=m(RELICS,v=>[v.n,v.d]);ZH.pots=m(POTS,v=>[v.n,v.d]);
  ZH.en=m(EN,v=>[v.n,v.d,m(v.moves,mv=>mv.n)]);
  ZH.unl=Object.fromEntries(UNLOCKS.map(u=>[u.k,[u.n,u.d]]));ZH.ev=Object.fromEntries(EVENTS.map(e=>[e.k,[e.t,e.x]]));
}
function applyLang(){
  snapZh();
  const T=LANG==='zh'?null:I18N[LANG];
  const g=(tbl,k)=>(T&&T[tbl]&&T[tbl][k])||ZH[{st:'st',cards:'cards',relics:'relics',pots:'pots',enemies:'en',unlocks:'unl',events:'ev'}[tbl]][k];
  ZH.acts.forEach((a,i)=>ACTS[i]=T?T.acts[i]:a);
  for(const k in NODE_N)NODE_N[k]=T?T.nodes[k]:ZH.nodes[k];
  for(const k in TN)TN[k]=T?T.types[k]:ZH.tn[k];
  for(const k in RN)RN[k]=T?T.rar[k]:ZH.rn[k];
  for(const k in ST){const v=g('st',k);ST[k].n=v[0];ST[k].d=v[1]}
  for(const k in CARDS){const v=g('cards',k);CARDS[k].n=v[0];CARDS[k].gu=v[1];CARDS[k].desc=v[2]}
  for(const k in RELICS){const v=g('relics',k);RELICS[k].n=v[0];RELICS[k].d=v[1]}
  for(const k in POTS){const v=g('pots',k);POTS[k].n=v[0];POTS[k].d=v[1]}
  for(const k in EN){const v=g('enemies',k);EN[k].n=v[0];EN[k].d=v[1];for(const mk in EN[k].moves)EN[k].moves[mk].n=(v[2]&&v[2][mk])||ZH.en[k][2][mk]}
  UNLOCKS.forEach(u=>{const v=g('unlocks',u.k);u.n=v[0];u.d=v[1]});
  EVENTS.forEach(e=>{const v=g('events',e.k);e.t=v[0];e.x=v[1]});
  if(B)B.en.forEach(e=>e.n=e.def.n);
  document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
}
function langButtons(){return `<span class="langs" role="group" aria-label="${L('语言')}">${LANGS.map(([c,l])=>`<button class="tbtn lang ${LANG===c?'on':''}" type="button" data-lang="${c}">${l}</button>`).join('')}</span>`}
function bindLang(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang))}
function setLang(c){
  if(c===LANG)return;LANG=c;try{localStorage.setItem('gzr.cards.lang',c)}catch(e){}
  applyLang();
  // 只重画不会重新掷骰子的界面；其他界面先换顶栏，下一个界面起全部是新语言
  if(SCREEN==='title')titleScreen();
  else if(SCREEN==='map')mapScreen();
  else if(SCREEN==='battle'&&B){buildBattle();renderBattle()}
  else if(SCREEN==='shop')shopScreen();
  else if(SCREEN==='rest')restScreen();
  else renderBar();
}

/* ================= 启动 ================= */
function start(d){
  applyLang();
  loadMeta();
  if(d&&d.R){R=d.R;UID=Math.max(1000,...R.deck.map(c=>c.uid||0));mapScreen();return}
  titleScreen();
}
const hot=window.claude?.hot;
hot?.snapshot?.(()=>({R:SCREEN==='title'||SCREEN==='end'?null:R}));
hot?.ready?hot.ready(start):start(hot?.data??{});
</script>
